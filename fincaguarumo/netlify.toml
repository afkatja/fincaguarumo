[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Set these in Netlify dashboard for production
  NODE_VERSION = "22"
  # Per-deploy site origin used by Supabase auth redirects.
  # Netlify provides $DEPLOY_URL automatically: https://docs.netlify.com/configure-builds/environment-variables/#deploy-urls-and-metadata
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_URL"

# Production headers for SSE
[[headers]]
  for = "/api/semantic-rag/stream*"
  [headers.values]
    Cache-Control = "no-cache, no-transform"
    Connection = "keep-alive"
    X-Accel-Buffering = "no"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Force HTTPS
[[redirects]]
  from = "http://*"
  to = "https://:splat"
  status = 301
  force = true

# Canonicalize www to non-www (consolidates indexing signals for GSC)
[[redirects]]
  from = "https://www.fincaguarumo.com/*"
  to = "https://fincaguarumo.com/:splat"
  status = 301
  force = true


# Global headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()" # locks down features

# Cache static assets aggressively (immutable + long cache)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images (if using next/image with loader or static imports)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images and videos in /public/assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages (so ISR/SSR updates propagate quickly)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify cron jobs for background tasks
[functions."calendar-sync"]
  schedule = "*/15 * * * *"  # Every 15 minutes
  function = "calendar-sync/calendar-sync"

[functions."ical-sync"]
  schedule = "*/15 * * * *"  # Every 15 minutes
  function = "ical-sync/ical-sync"
