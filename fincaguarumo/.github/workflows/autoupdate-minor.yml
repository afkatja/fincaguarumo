name: Auto Update Minor Dependencies

on:
  schedule:
    # Runs every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch: # Allows manual triggering

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create branches/commits
      pull-requests: write # Needed to create PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Adjust to your project's version
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Check for minor updates
        id: check
        run: |
          # Install ncu globally or use npx
          npx npm-check-updates --target minor --format group --reject '^(eslint|typescript)$'
          # The --target minor ensures we only get minor/patch, skipping majors
          # --reject allows to skip specific packages if needed

      - name: Apply updates to package.json
        run: npx npm-check-updates -u --target minor

      - name: Install updated dependencies
        run: npm install

      - name: Check for changes
        id: changes
        run: |
          git status --porcelain
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update minor dependencies"
          branch: auto-update-minor-deps
          title: "chore(deps): update minor dependencies"
          body: |
            This PR was auto-generated by GitHub Actions.
            Updates only **minor** and **patch** versions.

            - Skips major version updates (manual review required).
            - Generated on: ${{ github.event.head_commit.message }}
          labels: dependencies, automated pr
          draft: false
          delete-branch: true
